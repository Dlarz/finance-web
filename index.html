<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Finance-App</title>
    <meta name="description" content="Persönliche Einnahmen und Ausgaben, komplett offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance-App" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1015" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem('fa:theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
          var lang = localStorage.getItem('fa:lang');
          if (lang === 'de' || lang === 'en') document.documentElement.lang = lang;
          else if (!/^de/i.test(navigator.language || '')) document.documentElement.lang = 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
